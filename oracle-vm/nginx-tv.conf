# Place in /etc/nginx/conf.d/jiotv_cache.conf:
# proxy_cache_path /var/cache/nginx/jiotv levels=1:2 keys_zone=jiotv_cache:10m max_size=500m inactive=30d use_temp_path=off;

server {
    server_name tv.trylocalhost.com;

    # Caching for channel catalog, playlists, EPG, and logos
    # Automatically serves stale cache if homeserver goes offline
    location ~* ^/(channels|playlist\.m3u|epg\.xml\.gz|jtvimage) {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache jiotv_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        proxy_cache_valid 200 301 302 24h;
        proxy_cache_use_stale error timeout invalid_header updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Live streaming, MPD, license keys, and web UI
    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/tv.trylocalhost.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.trylocalhost.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = tv.trylocalhost.com) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name tv.trylocalhost.com;
    return 404;
}
