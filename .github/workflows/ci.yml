name: CI & Regression Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Linting & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check app/ tests/ scripts/

  test:
    name: Regression Tests (Python ${{ matrix.python-version }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest test suite
        run: pytest -v

  secret-sanity-check:
    name: Secret Leak Prevention Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no tracked secrets or credentials
        run: |
          echo "Checking for prohibited tracked files..."
          if git ls-files | grep -E '^\.env$|^data/auth\.json$|^data/settings\.json$'; then
            echo "::error::Tracked secret/credential file found in git index!"
            exit 1
          fi
          echo "Clean: No credentials tracked in git."
